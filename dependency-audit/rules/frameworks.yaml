# --- .NET
- framework: ASP.NET Core
  category: web-backend
  # Microsoft.AspNetCore.App is the shared framework that an SDK-style web project
  # (Sdk="Microsoft.NET.Sdk.Web") references implicitly; detect_inventory.py records it.
  packages: { nuget: [Microsoft.AspNetCore.App, Microsoft.AspNetCore.Mvc, Microsoft.AspNetCore.All] }
  signals: [Program.cs, Startup.cs, appsettings.json]
- framework: ASP.NET MVC
  category: web-backend
  packages: { nuget: [Microsoft.AspNet.Mvc] }
  signals: [Global.asax, Web.config]
- framework: ASP.NET Web API
