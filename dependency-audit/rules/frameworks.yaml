# rules/frameworks.yaml
#
# Package -> framework mapping for detect_inventory.py (spec Step 2). A framework is a library that
# shapes the application. It is reported once per workspace, and its support object is copied from
# the matching library entry, so a framework is only reported when one of its packages is in the
# inventory. Signals are extra evidence (file names or globs, relative to the workspace root).
#
# Ecosystem keys: npm, pypi, maven (group:artifact), go, cargo, gem, composer, nuget, pub, swift.
# A trailing * in a package name matches any suffix.
# Categories: web-fullstack, web-backend, ui, mobile, desktop, orm, api, task-queue, cms.

# --- JavaScript / TypeScript
- framework: Next.js
  category: web-fullstack
  packages: { npm: [next] }
  signals: [next.config.js, next.config.mjs, next.config.ts, app/layout.tsx, app/layout.jsx, pages/_app.tsx, pages/_app.jsx, src/app/layout.tsx]
- framework: Nuxt
  category: web-fullstack
  packages: { npm: [nuxt] }
  signals: [nuxt.config.ts, nuxt.config.js]
